[package]
name = "unicode-properties"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = "https://github.com/unicode-rs/unicode-properties"
repository = { workspace = true }
documentation = "https://docs.rs/unicode-properties"
license = { workspace = true }
keywords = ["text", "unicode"]
categories = ["no-std::no-alloc"]
readme = "README.md"
description = """
Query character Unicode properties according to
UAX #44 and UTR #51.
"""
exclude = [ "target/*", "Cargo.lock", "scripts/*" ]
rust-version = { workspace = true }

[features]
general-category = []
emoji = []
default = ["general-category", "emoji"]

[dependencies]
[workspace]
members = ["./","stask"]
resolver = "3"

[workspace.dependencies]
# Panic-free test vocabulary, consumed as an external git crate, tracking the
# crate's main branch. The version requirement (kept in sync with the crate's own
# version) keeps it off cargo-deny's wildcard ban; `Cargo.lock` records the
# resolved commit, refreshed by `just update`.
strict-test-support = { version = "0.1.1", git = "https://github.com/earthlings-dev/strict-test-support-rs.git", branch = "main"}
# Generic extension capabilities and the consumer-compiled `x` registry.
template-core = { version = "0.3.2", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main"}
template-stask = { version = "0.3.2", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main"}

[workspace.package]
authors = ["Charles Lew <crlf0710@gmail.com>", "Manish Goregaokar <manishsmail@gmail.com>"]
edition = "2024"
license = "(MIT OR Apache-2.0) AND Unicode-3.0"
publish = false
readme = "README.md"
repository = "https://github.com/strict-rs/unicode-properties"
version = "0.1.4"
rust-version = "1.99.0"

[patch."https://github.com/strict-rs/unicode-properties"]
unicode-properties = { path = "." }
